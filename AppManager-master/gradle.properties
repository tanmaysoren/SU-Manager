# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Settings specified in this file will override any Gradle settings
# configured through the IDE.

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.nonFinalResIds=false
# The proguard rules predate R8 full mode: they were written for the classic
# ProGuard keep semantics, which are laxer about reflective access. Full mode
# would strip more, but needs rules nobody wrote yet - keep the classic mode.
android.enableR8.fullMode=false

org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
org.gradle.caching=true
# org.gradle.unsafe.configuration-cache=true
